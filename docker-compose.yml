# Two Rooms and a Boom — self-hosted game night (see docs/PLAN.md).
#
#   docker compose up -d --build                     # local game night, http://<host-ip>:8080
#   DOMAIN=tworooms.example.com docker compose --profile https up -d --build   # + automatic HTTPS
#
# Game snapshots live in ./data/games.db and survive a restart or a rebuild.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # Override to move the SQLite snapshot file; the volume above must match.
      - DB_PATH=/data/games.db

  # Optional: automatic HTTPS on a public domain. Must be started with --profile https.
  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Compose interpolates the WHOLE file before it applies profiles, so a bare `${DOMAIN:?}`
      # would make even `docker compose up -d --build` (and `compose config`, and `compose build`)
      # fail unless DOMAIN was set — while this service only ever runs under the https profile.
      # A default keeps the plan's one command working; the value is ignored unless caddy runs.
      - DOMAIN=${DOMAIN:-tworooms.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
